# Start vault server locally for the purposes of integration tests.
# Choose one of [vault, vault-enterprise, vault-tls] by uncommenting the desired service.
services:
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: testtoken
    ports:
      - 8200:8200
    privileged: true
