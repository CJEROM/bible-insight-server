services:
  bible-db:
    image: timescale/timescaledb-ha:pg16.11-ts2.24.0-all-oss
    restart: always
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: bible-insight # default database
    volumes:
      - bible_pg_data:/var/lib/postgresql/data
volumes:
  bible_pg_data:
